[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "petdisp"
version = "0.1.0"
description = "Kinetic models, simulation and study design for single-scan PET displacement occupancy studies"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
notebook = ["matplotlib", "pandas", "jupyter"]
test = ["pytest"]

[tool.setuptools]
packages = ["petdisp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
